[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "office-platform"
version = "0.1.0"
description = "Multimodal internal platform for office departments"
requires-python = ">=3.11"
dependencies = [
    # Core: required to import and run the API + run the test suite. Heavy,
    # optional capabilities live in the extras below and are imported lazily,
    # so CI can install a lean set and the app degrades gracefully if absent.
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.2.5",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "structlog>=24.1",
    "prometheus-fastapi-instrumentator>=7.0",
    "slowapi>=0.1.9",
    "httpx>=0.27",
    "tenacity>=8.3",
]

[project.scripts]
seed-db = "app.initial_data:run"

[project.optional-dependencies]
# Local semantic embeddings (pulls torch). Falls back to a deterministic
# hashing embedder when absent (see services/embeddings.py).
ml = ["sentence-transformers>=3.0"]
# Document parsing + OCR.
documents = [
    "pytesseract>=0.3.10",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pillow>=10.3",
]
storage = ["boto3>=1.34"]
worker = ["celery>=5.4"]
llm = ["anthropic>=0.30"]
reports = ["fpdf2>=2.7", "openpyxl>=3.1"]
observability = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "sentry-sdk>=2.5",
]
# Everything needed for a production runtime image.
full = [
    "office-platform[ml,documents,storage,worker,llm,reports,observability]",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "ruff>=0.4",
    "black>=24.4",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "aiosqlite>=0.20",
]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "ASYNC"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Run async tests + fixtures in a single session-scoped event loop so the
# session-scoped DB engine fixture is usable across tests (pytest-asyncio 1.x).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --cov=app --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "integration: tests that require a live Postgres/Redis (skipped if absent)",
]
