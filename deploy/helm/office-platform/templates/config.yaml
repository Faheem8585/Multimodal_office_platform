apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "office.fullname" . }}-config
  labels:
    {{- include "office.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "office.fullname" . }}-secrets
  labels:
    {{- include "office.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
