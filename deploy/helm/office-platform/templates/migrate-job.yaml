{{- if .Values.migrations.enabled }}
# Runs Alembic migrations before install/upgrade. The hook-delete policy keeps
# the namespace clean; hook-weight ensures it completes before app pods roll.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "office.fullname" . }}-migrate
  labels:
    {{- include "office.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "office.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "office.apiImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            {{- include "office.envFrom" . | nindent 12 }}
{{- end }}
